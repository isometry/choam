version: 2
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w"
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
snapshot:
  version_template: "{{ .Tag }}-next"
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
release:
  draft: false
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
homebrew_casks:
  - name: choam
    description: Track updates for melange build specification files
    homepage: https://just.breathe.io/project/choam/
    repository:
      owner: isometry
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    # GoReleaser's hook renderer emits deprecated flight blocks. Use the
    # declarative API when available and preserve older Homebrew support.
    custom_block: |
      # Older Homebrew reports unknown DSL methods through respond_to_missing?.
      if self.class.method_defined?(:postflight_steps)
        postflight_steps do
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/choam"]
          end
        end
      else
        # Bind the legacy DSL only on Homebrew versions that need it.
        method(:postflight).call do
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/choam"]
          end
        end
      end
