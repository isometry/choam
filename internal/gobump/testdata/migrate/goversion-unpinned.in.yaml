package:
  name: example
  version: "1.0.0"
  epoch: 0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/example/example
      tag: v${{package.version}}

  - uses: go/bump
    with:
      # Pins the go.mod syntax version gobump's tidy writes.
      go-version: "1.26.8"
      deps: |-
        golang.org/x/net@v0.55.0

  - uses: go/build
    with:
      packages: .
      output: example

subpackages:
  - name: example-cli
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/cli
          output: cli
