package:
  name: example
  version: "1.0.0"
  epoch: 0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/example/example
      tag: v${{package.version}}

  - uses: bump
    with:
      deps: |-
        golang.org/x/text@v0.39.0
      replaces: |-
        golang.org/x/net=golang.org/x/net@v0.56.0
      language: go

  - uses: go/build
    with:
      packages: .
