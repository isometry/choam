package:
  name: example
  version: "1.0.0"
  epoch: 3 # keep this comment

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/example/example
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: fix.patch

  # bump vulnerable deps
  - uses: bump # legacy wrapper
    with:
      deps: |-
        golang.org/x/net@v0.56.0
        golang.org/x/text@v0.39.0
      language: go

  - runs: |
      echo "unrelated"

  - uses: go/build
    with:
      packages: .
      output: example
